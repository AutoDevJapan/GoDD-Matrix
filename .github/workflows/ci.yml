name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチの旧ワークフローはキャンセルして無駄な実行を避ける
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 品質ゲート (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Scope browser acceptance
        id: browser_scope
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if git diff --quiet "$BASE_SHA" HEAD -- web/ src/ scripts/build-web.mjs scripts/web-build-inputs.mjs scripts/prepare-real-index.mjs verification/ scripts/serve-web.mjs scripts/check-browser-report.mjs scripts/record-browser-build.mjs scripts/browser-log-capture.sh package.json pnpm-lock.yaml pnpm-workspace.yaml .pnpmfile.cjs .npmrc .gitattributes playwright.config.ts ':(glob)tsconfig*.json' .github/workflows/ci.yml; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" -eq 1 ]] || exit "$status"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi


      # package.json の packageManager (pnpm@x) からバージョンを解決する
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Typecheck browser tests
        run: pnpm typecheck:e2e

      - name: Test (vitest)
        run: pnpm test

      - name: Build (tsc)
        run: pnpm build

      - name: Stage compiled MCP registration planner
        env:
          PLANNER_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLANNER_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          planner="$RUNNER_TEMP/godd-matrix-planner"
          mkdir -- "$planner"
          mkdir -- "$planner/scripts" "$planner/dist" "$planner/dist/release" "$planner/documents"
          for file in scripts/plan-mcp-hosts.mjs dist/release/host-registration-cli.js dist/release/host-registration.js documents/mcp-formal-module-scope.package.json.template LICENSE; do
            [[ -f "$file" && ! -L "$file" ]]
            cp -- "$file" "$planner/$file"
            cmp -- "$file" "$planner/$file"
          done
          printf '%s  %s\n' \
            1239d4d885dcad42201a27ed9324f8f0f760b78700d8db9ced39a511cffe7eae \
            "$planner/documents/mcp-formal-module-scope.package.json.template" | sha256sum --check --strict
          cp -- "$planner/documents/mcp-formal-module-scope.package.json.template" "$planner/package.json"
          cmp -- "$planner/package.json" "$planner/documents/mcp-formal-module-scope.package.json.template"
          printf '{"schema":"godd-matrix-planner-build-v1","repository":"AutoDevJapan/GoDD-Matrix","checkout_sha":"%s","source_head":"%s","run_id":%s,"attempt":%s,"workflow":".github/workflows/ci.yml","build_step":"Build (tsc)"}\n' \
            "$GITHUB_SHA" "$PLANNER_SOURCE_HEAD" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$planner/SOURCE.json"
          (
            cd "$planner"
            sha256sum LICENSE package.json scripts/plan-mcp-hosts.mjs dist/release/host-registration-cli.js dist/release/host-registration.js documents/mcp-formal-module-scope.package.json.template SOURCE.json > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Retain compiled MCP registration planner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godd-matrix-planner-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/godd-matrix-planner/
          if-no-files-found: error
          retention-days: 14

      - name: Build static web
        run: pnpm build:web

      - name: Snapshot fixed compiled build
        id: initial_proof
        if: steps.browser_scope.outputs.enabled == 'true'
        run: node scripts/record-browser-build.mjs before

      - name: Prepare fixed full-index input
        id: real_input
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 3
        run: node scripts/prepare-real-index.mjs

      - name: Check production catalog against the complete fixed index
        id: real_catalog
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 3
        run: |
          source scripts/browser-log-capture.sh
          if capture_browser_command web/browser-evidence/real-catalog.stdout.txt web/browser-evidence/real-catalog.stderr.txt pnpm exec vitest run --config verification/vitest.matrix-real.config.ts --reporter=json --outputFile=web/browser-evidence/real-catalog.vitest.json; then
            echo 'Real catalog stream capture complete.'
          else
            echo 'Real catalog stream capture incomplete; available logs are diagnostic only.' >&2
            exit 1
          fi
          printf '%s\n' "$CAPTURE_COMMAND_STATUS" > web/browser-evidence/real-catalog.exit.txt
          [[ "$CAPTURE_COMMAND_STATUS" -eq 0 ]]

      - name: Check artifact outcome controls
        if: steps.browser_scope.outputs.enabled == 'true'
        run: node scripts/record-browser-build.mjs --self-test

      - name: Check stream capture controls
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 2
        run: |
          [[ ":$SHELLOPTS:" == *:pipefail:* ]]
          bash scripts/browser-log-capture.sh --self-test | tee web/browser-evidence/stream-controls.txt

      - name: Install Chromium for scoped browser checks
        if: steps.browser_scope.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Native browser selection control
        id: browser_selection
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 2
        env:
          MATRIX_TEST_MUTATION: 'selection'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/web/browser-evidence/selection.json
        run: |
          source scripts/browser-log-capture.sh
          if capture_browser_command web/browser-evidence/selection.stdout.txt web/browser-evidence/selection.stderr.txt pnpm exec playwright test web/e2e/virtual-catalog.spec.ts --grep 'keeps an untouched color' --workers=1 --retries=0 --global-timeout=90000 --reporter=json --output=web/browser-evidence/selection-files; then
            node scripts/check-browser-report.mjs selection "$CAPTURE_COMMAND_STATUS" "$CAPTURE_STDOUT_STATUS" "$CAPTURE_STDERR_STATUS" "$CAPTURE_STDOUT_PID" "$CAPTURE_STDERR_PID"
          else
            echo 'Stream capture incomplete; available logs are diagnostic only.' >&2
            exit 1
          fi
      - name: Native browser stale control
        id: browser_stale
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 2
        env:
          MATRIX_TEST_MUTATION: 'stale'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/web/browser-evidence/stale.json
        run: |
          source scripts/browser-log-capture.sh
          if capture_browser_command web/browser-evidence/stale.stdout.txt web/browser-evidence/stale.stderr.txt pnpm exec playwright test web/e2e/virtual-catalog.spec.ts --grep 'ignores an old materialized response after selecting another cell' --workers=1 --retries=0 --global-timeout=90000 --reporter=json --output=web/browser-evidence/stale-files; then
            node scripts/check-browser-report.mjs stale "$CAPTURE_COMMAND_STATUS" "$CAPTURE_STDOUT_STATUS" "$CAPTURE_STDERR_STATUS" "$CAPTURE_STDOUT_PID" "$CAPTURE_STDERR_PID"
          else
            echo 'Stream capture incomplete; available logs are diagnostic only.' >&2
            exit 1
          fi
      - name: Native browser link control
        id: browser_link
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 2
        env:
          MATRIX_TEST_MUTATION: 'link'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/web/browser-evidence/link.json
        run: |
          source scripts/browser-log-capture.sh
          if capture_browser_command web/browser-evidence/link.stdout.txt web/browser-evidence/link.stderr.txt pnpm exec playwright test web/e2e/virtual-catalog.spec.ts --grep 'does not reopen a waiting link after another cell was closed' --workers=1 --retries=0 --global-timeout=90000 --reporter=json --output=web/browser-evidence/link-files; then
            node scripts/check-browser-report.mjs link "$CAPTURE_COMMAND_STATUS" "$CAPTURE_STDOUT_STATUS" "$CAPTURE_STDERR_STATUS" "$CAPTURE_STDOUT_PID" "$CAPTURE_STDERR_PID"
          else
            echo 'Stream capture incomplete; available logs are diagnostic only.' >&2
            exit 1
          fi
      - name: Native browser editor control
        id: browser_editor
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 2
        env:
          MATRIX_TEST_MUTATION: 'editor'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/web/browser-evidence/editor.json
        run: |
          source scripts/browser-log-capture.sh
          if capture_browser_command web/browser-evidence/editor.stdout.txt web/browser-evidence/editor.stderr.txt pnpm exec playwright test web/e2e/virtual-catalog.spec.ts --grep 'keeps the color editor node, caret and draft on index arrival|keeps an edited color and the page text on index arrival|builds a fresh editor for the cell opened after the first one' --workers=1 --retries=0 --global-timeout=90000 --reporter=json --output=web/browser-evidence/editor-files; then
            node scripts/check-browser-report.mjs editor "$CAPTURE_COMMAND_STATUS" "$CAPTURE_STDOUT_STATUS" "$CAPTURE_STDERR_STATUS" "$CAPTURE_STDOUT_PID" "$CAPTURE_STDERR_PID"
          else
            echo 'Stream capture incomplete; available logs are diagnostic only.' >&2
            exit 1
          fi
      - name: Native browser fixed control
        id: browser_fixed
        if: steps.browser_scope.outputs.enabled == 'true'
        timeout-minutes: 6
        env:
          MATRIX_TEST_MUTATION: ''
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/web/browser-evidence/fixed.json
        run: |
          source scripts/browser-log-capture.sh
          if capture_browser_command web/browser-evidence/fixed.stdout.txt web/browser-evidence/fixed.stderr.txt pnpm exec playwright test web/e2e/virtual-catalog.spec.ts --workers=1 --retries=0 --global-timeout=300000 --reporter=json --output=web/browser-evidence/fixed-files; then
            node scripts/check-browser-report.mjs fixed "$CAPTURE_COMMAND_STATUS" "$CAPTURE_STDOUT_STATUS" "$CAPTURE_STDERR_STATUS" "$CAPTURE_STDOUT_PID" "$CAPTURE_STDERR_PID"
          else
            echo 'Stream capture incomplete; available logs are diagnostic only.' >&2
            exit 1
          fi
      - name: Verify unchanged build and record browser evidence
        id: provenance
        if: always() && steps.initial_proof.outcome == 'success'
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          SELECTION_OUTCOME: ${{ steps.browser_selection.outcome }}
          STALE_OUTCOME: ${{ steps.browser_stale.outcome }}
          LINK_OUTCOME: ${{ steps.browser_link.outcome }}
          EDITOR_OUTCOME: ${{ steps.browser_editor.outcome }}
          FIXED_OUTCOME: ${{ steps.browser_fixed.outcome }}
          REAL_INPUT_OUTCOME: ${{ steps.real_input.outcome }}
          REAL_CATALOG_OUTCOME: ${{ steps.real_catalog.outcome }}
        run: node scripts/record-browser-build.mjs after

      - name: Retain static web and browser evidence
        if: always() && steps.provenance.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-web-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            web/dist/
            web/build-proof.json
            web/build-inputs.json
            web/browser-evidence/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Retain partial browser diagnostics
        if: always() && steps.provenance.outputs.evidence_validated == 'true' && steps.provenance.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-browser-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: web/browser-evidence/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # The whole virtual-catalog spec runs once on the fixed build; other suites remain local.
      # The scoped CI controls never rewrite source or fixed build.


  gitleaks:
    name: シークレット走査 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git 履歴全体を走査するため全コミットを取得する
          fetch-depth: 0

      # gitleaks-action v2 は Organization で有償ライセンスを要求するため、
      # ライセンス不要な CLI バイナリを直接取得して実行する。
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" \
            | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --redact --verbose --exit-code 1
